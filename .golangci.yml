run:
  timeout: 5m
  issues-exit-code: 1
  tests: true

linters:
  disable-all: true
  enable:
    - errcheck
    - ineffassign
    - unused
    - gofmt
    - gocyclo
    - misspell
    - revive

linters-settings:
  gocyclo:
    min-complexity: 15
  misspell:
    locale: US

issues:
  exclude-dirs:
    - proto/gen
    - gen
    - docs
